# CI on GitHub-hosted runners: this repo's gate, `make verify`.
# The api repo's release workflow publishes a frontend image only for a main
# commit on which this job ("verify") passed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Paired PRs (factory: the api PR and its web PR land together): use the
      # api branch naming the same PAC ticket as this branch, else main.
      # Candidates with an open PR in the api repo win: branches of superseded
      # PRs linger and would otherwise make the match ambiguous (-> main).
      - name: Paired api branch
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OTHER: Enach/clockwise-like
        run: |
          n() { printf '%s\n' "$1" | grep -c . || true; }  # count lines
          j() { printf '%s\n' "$1" | paste -sd' ' -; }      # join lines
          ref=main why="no pac-N in branch name"
          t=$(grep -oiE 'pac-[0-9]+' <<<"$BRANCH" | head -1 | tr '[:upper:]' '[:lower:]' || true)
          if [ -n "$t" ]; then
            m=$(gh api --paginate "repos/$OTHER/branches" --jq '.[].name' | grep -iE "(^|[^a-z0-9])$t([^0-9]|$)" || true)
            why="no api branch for $t"
            o=""
            if [ -n "$m" ]; then
              if heads=$(gh api --paginate "repos/$OTHER/pulls?state=open&per_page=100" --jq ".[] | select(.head.repo.full_name == \"$OTHER\") | .head.ref"); then
                o=$(printf '%s\n' "$m" | grep -xF -f <(printf '%s\n' "$heads") || true)
              else
                echo "::warning::could not list open $OTHER PRs; pairing by branch name only"
              fi
            fi
            echo "candidates for $t: $(j "$m") | with an open PR: $(j "$o")"
            if [ "$(n "$o")" -eq 1 ]; then ref=$o why="only $t branch with an open PR"
            else
              if [ -n "$o" ]; then m=$o src="open-PR candidates"; else src="candidates (none has an open PR)"; fi
              # several (factory/pac-N-spec, impl/pac-N-api...): keep this branch's prefix (impl/)
              if [ "$(n "$m")" -gt 1 ] && [[ $BRANCH == */* ]]; then
                m=$(printf '%s\n' "$m" | grep -F "${BRANCH%%/*}/" || true)
                why="no ${BRANCH%%/*}/ branch among $src"
              fi
              # a lone leftover of another stage (factory/pac-N-spec for impl/...) with no open PR is stale
              if [ "$(n "$m")" -eq 1 ] && [ -z "$o" ] && [[ $BRANCH == */* && $m == */* && ${m%%/*} != "${BRANCH%%/*}" ]]; then
                why="only match $m has another prefix than ${BRANCH%%/*}/ and no open PR"
                echo "::notice::ignoring $m for $t: prefix differs from ${BRANCH%%/*}/ and no open PR; using main"
              elif [ "$(n "$m")" -eq 1 ]; then ref=$m why="only match among $src"
              elif printf '%s\n' "$m" | grep -qxF "$BRANCH"; then ref=$BRANCH why="same name as this branch, among $src"
              elif [ -n "$m" ]; then
                why="several api branches among $src: $(j "$m")"
                echo "::warning::several api branches for $t: $(j "$m"); using main"
              fi
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "api ref: $ref ($why)"

      # The contract lives in the api repo (CONTRACT ?= ../clockwise-like/...).
      - uses: actions/checkout@v4
        with:
          repository: Enach/clockwise-like
          ref: ${{ steps.pair.outputs.ref }}
          path: api
      - run: mv api ../clockwise-like

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      # Pushes to main skip the cross-repo half of openapi-check: a paired
      # contract change merges api first and web minutes later, and in between
      # the two mains disagree by design. The api repo's release.yml runs that check on the
      # exact pair of main SHAs it would publish. PRs keep the full check.
      - name: make verify
        env:
          OPENAPI_CROSS_REPO: ${{ github.event_name == 'push' && 'skip' || 'check' }}
        run: make verify

      - name: Verify summary
        if: always()
        run: cat .verify/steps.txt 2>/dev/null || true
