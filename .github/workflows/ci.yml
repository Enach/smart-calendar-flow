name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  unit:
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun add -d @vitest/coverage-v8
      - run: bunx vitest run --shard=${{ matrix.shard }}/3 --coverage --coverage.reportsDirectory=coverage-${{ matrix.shard }} --coverage.reporter=json-summary --coverage.reporter=text
      - uses: actions/upload-artifact@v4
        with: { name: coverage-${{ matrix.shard }}, path: coverage-${{ matrix.shard }} }

  coverage:
    runs-on: [self-hosted, linux, x64]
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: coverage-*, merge-multiple: true, path: coverage-merged }
      - name: Enforce >=70% lines coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import json, glob, sys
          totals = {"lines": {"covered": 0, "total": 0}}
          for f in glob.glob("coverage-merged/**/coverage-summary.json", recursive=True) + glob.glob("coverage-merged/coverage-summary.json"):
              with open(f) as fh:
                  data = json.load(fh)
              t = data.get("total", {}).get("lines", {})
              totals["lines"]["covered"] += t.get("covered", 0)
              totals["lines"]["total"] += t.get("total", 0)
          if totals["lines"]["total"] == 0:
              print("No coverage summary found; skipping (no tests yet).")
              sys.exit(0)
          pct = 100 * totals["lines"]["covered"] / totals["lines"]["total"]
          print(f"Line coverage: {pct:.2f}% ({totals['lines']['covered']}/{totals['lines']['total']})")
          if pct < 70:
              sys.exit(1)
          PY

  build:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t smart-calendar-flow:${{ github.sha }} .

  integration:
    runs-on: [self-hosted, linux, x64]
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait
      - name: Smoke
        run: curl -fsS http://localhost:8080/ > /dev/null
      - if: always()
        run: docker compose down -v
