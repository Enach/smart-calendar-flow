# CI on GitHub-hosted runners: this repo's gate, `make verify`.
# The api repo's release workflow publishes a frontend image only for a main
# commit on which this job ("verify") passed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Paired PRs (factory: the api PR and its web PR land together) share the
      # exact branch name: use the api branch with this branch's name (an open
      # PR first), else main. Never a sibling that merely shares the pac-N
      # (api repo docs/factory/README.md, "Paired branches"). Same step in both repos.
      - name: Pairing script tests
        run: bash scripts/ci/pair-branch.test.sh
      - name: Paired api branch
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OTHER: Enach/clockwise-like
          LABEL: api
        run: bash scripts/ci/pair-branch.sh

      # The contract lives in the api repo (CONTRACT ?= ../clockwise-like/...).
      - uses: actions/checkout@v4
        with:
          repository: Enach/clockwise-like
          ref: ${{ steps.pair.outputs.ref }}
          path: api
      - run: mv api ../clockwise-like

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      # Pushes to main skip the cross-repo half of openapi-check: a paired
      # contract change merges api first and web minutes later, and in between
      # the two mains disagree by design. The api repo's release.yml runs that check on the
      # exact pair of main SHAs it would publish. PRs keep the full check.
      - name: make verify
        env:
          OPENAPI_CROSS_REPO: ${{ github.event_name == 'push' && 'skip' || 'check' }}
        run: make verify

      - name: Verify summary
        if: always()
        run: cat .verify/steps.txt 2>/dev/null || true
