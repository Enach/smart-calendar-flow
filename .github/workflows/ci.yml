# Frontend CI runs in clockwise-like/frontend-publish.yml, not here.
#
# GitHub Actions billing is locked on this account, so workflows defined in
# this repository cannot execute. The full frontend pipeline (lint, test,
# quality, SAST, DAST, build, scan, push) lives at:
#
#   https://github.com/Enach/clockwise-like/blob/main/.github/workflows/frontend-publish.yml
#
# Triggering:
#   - Automatic: the .githooks/pre-push hook dispatches a repository_dispatch
#     event to clockwise-like on every push to main.
#   - Manual: "Run workflow" button on the frontend-publish workflow in
#     clockwise-like (workflow_dispatch trigger).
#
# Hook setup (one-time, per developer machine):
#   git config core.hooksPath .githooks
#   mkdir -p ~/.config/paceday
#   echo "ghp_your_token" > ~/.config/paceday/backend_repo_token
#   chmod 600 ~/.config/paceday/backend_repo_token
