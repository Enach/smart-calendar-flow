name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  unit:
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun add -d @vitest/coverage-v8
      - run: bunx vitest run --shard=${{ matrix.shard }}/3 --coverage --coverage.reportsDirectory=coverage-${{ matrix.shard }} --coverage.reporter=json-summary --coverage.reporter=text
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}

  coverage:
    runs-on: [self-hosted, linux, x64]
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage-merged
      - name: Enforce coverage gate
        shell: bash
        run: |
          if [ ! -f coverage-merged/coverage-summary.json ]; then
            echo "No coverage-summary.json found; skipping (no tests yet)."
            exit 0
          fi
          PCT=$(node -e "const d=require('./coverage-merged/coverage-summary.json'); console.log(d.total.lines.pct)")
          echo "Lines coverage: ${PCT}%"
          awk -v p="$PCT" 'BEGIN{ exit (p+0 < 70) }'

  build:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t smart-calendar-flow:${{ github.sha }} .

  integration:
    runs-on: [self-hosted, linux, x64]
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait
      - name: Smoke
        run: curl -fsS http://localhost:8080/ > /dev/null
      - if: always()
        run: docker compose down -v
